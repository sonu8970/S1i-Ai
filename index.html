<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>S1i AI – Smart Intelligence for a Bigger Tomorrow</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@800;900&family=Inter:wght@500;600&display=swap">
<style>
:root{--ink:#0e1a2b;--muted:#3a4658;--blue:#2a7bff;--gold:#ffb347;box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
html,body{margin:0}
html{background:#2f9bf0;min-height:100%}
body::before{content:"";position:fixed;left:0;right:0;top:0;bottom:0;z-index:-1;pointer-events:none;background:radial-gradient(120% 70% at 50% 0%,#bfe6ff 0%,rgba(191,230,255,0) 60%),linear-gradient(180deg,#6cc3ff 0%,#3aa4f5 45%,#1f7fe0 100%)}
body{background:transparent;display:flow-root}
body{font-family:Inter,"Segoe UI",system-ui,sans-serif;color:var(--ink);min-height:100vh;min-height:100dvh;overflow-x:hidden;position:relative;padding-bottom:env(safe-area-inset-bottom,0px)}
.float{position:absolute;pointer-events:none;filter:blur(3px) drop-shadow(0 10px 20px rgba(0,0,0,.35));opacity:.85}
.f1{width:170px;left:-50px;top:40px;transform:rotate(-14deg)}
.f2{width:170px;left:-60px;top:380px;transform:rotate(10deg)}
.f3{width:160px;right:-40px;top:230px;transform:rotate(14deg)}
.f4{width:150px;right:-50px;top:700px;transform:rotate(-8deg);filter:blur(5px)}
.f5{width:200px;left:-80px;bottom:60px;transform:rotate(8deg);filter:blur(6px)}
.card{position:relative;z-index:1;width:min(92vw,520px);margin:24px auto;background:linear-gradient(#fff 60%,#eef1f6);border-radius:48px;padding:34px 28px 26px;text-align:center;box-shadow:0 20px 70px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.4)}
.brand{letter-spacing:.35em;font-weight:600;font-size:15px;margin:0}
.brand,.bar b,.sub b,footer b{font-family:Orbitron,Anton,Impact,sans-serif;font-weight:900;text-transform:uppercase;background:linear-gradient(90deg,#2a7bff,#7a4dff 55%,#ffb347);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;text-shadow:none}
footer b{background:linear-gradient(90deg,#fff,#ffe2a8);-webkit-background-clip:text;background-clip:text;filter:drop-shadow(0 1px 6px rgba(0,0,0,.6))}
h1{font-family:Anton,Impact,"Arial Narrow",sans-serif;font-weight:400;font-size:clamp(52px,14vw,76px);line-height:.95;letter-spacing:-.01em;text-transform:uppercase;margin:14px 0 18px;text-align:left}
.sub{margin:0;font-size:12.5px;letter-spacing:.3em;color:var(--muted)}
.sub b{display:block;font-weight:600;color:var(--ink);margin-bottom:4px}
.hero{width:min(100%,400px);margin:6px auto 0;display:block;filter:drop-shadow(0 22px 28px rgba(0,0,0,.35))}
.perks{display:grid;grid-template-columns:repeat(4,1fr);margin:14px 0 20px}
.perk{padding:2px 6px;font-size:10.5px;font-weight:600;letter-spacing:.03em;line-height:1.25;text-transform:uppercase}
.perk+.perk{border-left:1px solid #cfd5df}
.perk svg{display:block;margin:0 auto 8px}
.go{display:flex;align-items:center;justify-content:center;gap:12px;width:min(100%,300px);margin:auto;padding:16px;border-radius:40px;background:#0b1424;color:#fff;font-weight:600;font-size:14px;letter-spacing:.16em;text-transform:uppercase;border:2px solid var(--blue);box-shadow:0 0 18px rgba(42,123,255,.5)}
.go{position:relative;animation:bub 1.8s ease-in-out infinite}
.go::before,.go::after{content:"";position:absolute;inset:-2px;border-radius:40px;border:2px solid var(--blue);pointer-events:none;opacity:0;animation:ring 1.8s ease-out infinite}
.go::after{animation-delay:.9s}
.go span{display:inline-block;animation:nudge 1.8s ease-in-out infinite}
.go:hover,.go:active{animation-play-state:paused}
@keyframes bub{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
@keyframes ring{0%{transform:scale(1);opacity:.7}100%{transform:scale(1.35,1.9);opacity:0}}
@keyframes nudge{0%,100%{transform:translateX(0)}50%{transform:translateX(5px)}}
@media (prefers-reduced-motion:reduce){.go,.go::before,.go::after,.go span{animation:none}}
.go:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
footer{position:relative;z-index:1;text-align:center;padding:4px 16px 28px}
footer b{display:block;color:#fff;letter-spacing:.35em;font-size:15px;margin-bottom:6px;text-shadow:0 1px 6px rgba(0,0,0,.6)}
footer span{color:#fff;font-size:11px;letter-spacing:.3em;text-transform:uppercase;text-shadow:0 1px 6px rgba(0,0,0,.6)}
.bar{position:relative;z-index:3;display:flex;align-items:center;justify-content:space-between;width:min(92vw,520px);margin:calc(14px + env(safe-area-inset-top,0px)) auto 14px;padding:10px 14px 10px 24px;background:#fff;border-radius:32px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.bar b{letter-spacing:.3em;font-size:14px}
.menu-btn{width:44px;height:44px;border:0;background:none;border-radius:50%;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;cursor:pointer}
.menu-btn span{display:block;width:22px;height:2.5px;border-radius:2px;background:var(--ink)}
.menu-btn:focus-visible{outline:3px solid var(--gold)}
.act{display:flex;align-items:center;gap:6px}
.login{padding:8px 16px;border-radius:30px;background:#0b1424;color:#fff;text-decoration:none;font-weight:600;font-size:12px;letter-spacing:.08em;text-transform:uppercase;border:2px solid var(--blue);box-shadow:0 0 12px rgba(42,123,255,.4)}
.login:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.menu{display:none;position:absolute;right:8px;top:100%;margin-top:6px;min-width:190px;background:#fff;border-radius:20px;padding:8px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.menu.open{display:block}
.menu a{display:block;padding:12px 16px;border-radius:12px;color:var(--ink);text-decoration:none;font-weight:600;font-size:14px}
.menu a:hover,.menu a:focus-visible{background:#eef1f6;outline:none}
.menu a.cta{background:#0b1424;color:#fff;margin-top:4px;text-align:center}
@keyframes unroll{0%{clip-path:inset(-40px -80px calc(100% + 0px) -80px);transform:perspective(900px) rotateX(-8deg);transform-origin:top}60%{transform:perspective(900px) rotateX(2deg)}100%{clip-path:inset(-40px -80px -90px -80px);transform:none}}
.card.unroll{animation:unroll 1.1s cubic-bezier(.22,.8,.3,1) both}
@media (prefers-reduced-motion:reduce){.card.unroll{animation:none}}
@media (max-width:560px){.perk{font-size:9px}.f1,.f2,.f3,.f4,.f5{opacity:.5}}

.brand,.bar b,.sub b,footer b{letter-spacing:.06em;background-image:linear-gradient(110deg,#2a7bff 0%,#2a7bff 30%,#fff 45%,#ffb347 55%,#7a4dff 70%,#2a7bff 100%);background-size:250% 100%;background-repeat:no-repeat;animation:shine 2.8s linear infinite;filter:none;text-shadow:none;box-shadow:none}
footer b{background-image:linear-gradient(110deg,#fff 0%,#fff 30%,#7fd0ff 45%,#ffb347 55%,#fff 70%,#fff 100%)}
.bar b{font-size:15px}
.sub b{letter-spacing:.1em;font-size:15px}
@keyframes shine{0%{background-position:100% 0}100%{background-position:0% 0}}
@media (prefers-reduced-motion:reduce){.brand,.bar b,.sub b,footer b{animation:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#b9b6b0"/><stop offset=".5" stop-color="#8a8a8c"/><stop offset="1" stop-color="#5d5f66"/></linearGradient>
<linearGradient id="edge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc062"/><stop offset=".5" stop-color="#6b5a3a"/><stop offset="1" stop-color="#2a7bff"/></linearGradient>
<symbol id="tile" viewBox="0 0 220 230">
<rect x="22" y="38" width="180" height="180" rx="40" fill="#15171c" stroke="url(#edge)" stroke-width="4"/>
<rect x="8" y="12" width="180" height="180" rx="40" fill="url(#metal)" stroke="url(#edge)" stroke-width="4"/>
<circle cx="39" cy="41" r="7.5" fill="#14161b"/>
<g transform="translate(3 0)" fill="none" stroke-linecap="round" stroke-linejoin="round">
<path d="M46 138C77 147 113 131 113 115C113 108 105 108 104 102C104 95 123 88 139 86V127" stroke="#17181d" stroke-width="9"/>
<circle cx="143" cy="68" r="8" fill="#17181d" stroke="none"/>
</g>
</symbol>
</defs>
</svg>

<svg class="float f1" viewBox="0 0 220 230" aria-hidden="true"><use href="#tile"/></svg>
<svg class="float f2" viewBox="0 0 220 230" aria-hidden="true"><use href="#tile"/></svg>
<svg class="float f3" viewBox="0 0 220 230" aria-hidden="true"><use href="#tile"/></svg>
<svg class="float f4" viewBox="0 0 220 230" aria-hidden="true"><use href="#tile"/></svg>
<svg class="float f5" viewBox="0 0 220 230" aria-hidden="true"><use href="#tile"/></svg>

<header class="bar"><b>S1i AI</b>
<div class="act"><a class="login" href="#">Login</a><button class="menu-btn" id="mb" aria-label="Menu" aria-expanded="false" aria-controls="mn"><span></span><span></span><span></span></button></div>
<nav class="menu" id="mn"><a href="#">Login</a><a href="#">Contact</a><a href="#">Help</a><a class="cta" href="#">Explore S1i</a></nav></header>
<script>var b=document.getElementById("mb"),m=document.getElementById("mn");b.onclick=function(){var o=m.classList.toggle("open");b.setAttribute("aria-expanded",o)};</script>
<main class="card">
<p class="brand">S1i AI</p>
<h1>Smart Intelligence for a Bigger Tomorrow</h1>
<p class="sub"><b>S1i AI</b>Smart One Intelligence</p>
<svg class="hero" viewBox="0 0 220 230" role="img" aria-label="S1i logo tile"><use href="#tile"/></svg>
<div class="perks">
<div class="perk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0e1a2b" stroke-width="1.5"><path d="M9 4a3 3 0 0 0-3 3 3 3 0 0 0-2 3 3 3 0 0 0 1 3 3 3 0 0 0 3 4 3 3 0 0 0 5 1V5a2 2 0 0 0-4-1zM15 4a3 3 0 0 1 3 3 3 3 0 0 1 2 3 3 3 0 0 1-1 3 3 3 0 0 1-3 4 3 3 0 0 1-3 1"/></svg>Smart<br>Ideas</div>
<div class="perk"><svg width="34" height="34" viewBox="0 0 24 24" fill="#0e1a2b"><path d="M13 2L5 14h6l-1 8 8-12h-6z"/></svg>Faster<br>Solutions</div>
<div class="perk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0e1a2b" stroke-width="1.8"><rect x="3" y="14" width="4" height="7"/><rect x="10" y="9" width="4" height="12"/><rect x="17" y="3" width="4" height="18"/></svg>Higher<br>Productivity</div>
<div class="perk"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#0e1a2b" stroke-width="1.6"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/></svg>Secure<br>and Reliable</div>
</div>
<a class="go" href="#">Explore S1i AI <span aria-hidden="true">&rarr;</span></a>
</main>
<footer><b>S1i AI</b><span>Ideas | Technology | People | Future</span></footer>
<script>(function(){var c=document.querySelector(".card");function play(){c.classList.remove("unroll");void c.offsetWidth;c.classList.add("unroll")}
play();setInterval(function(){if(!document.hidden)play()},120000);addEventListener("pageshow",function(e){if(e.persisted)play()});
document.addEventListener("visibilitychange",function(){if(!document.hidden)play()});
c.addEventListener("animationend",function(e){if(e.target===c)c.classList.remove("unroll")})})();</script>
</body>
</html>
